<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Prediction System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4facfe,#00f2fe);
}

/* Login Container */

.container{
background:white;
padding:35px;
border-radius:12px;
width:350px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
text-align:center;
margin-bottom:20px;
color:#333;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
outline:none;
}

button{
width:100%;
padding:10px;
background:#4facfe;
border:none;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#008cff;
}

.link{
text-align:center;
margin-top:10px;
cursor:pointer;
color:#4facfe;
}

/* Prediction Page */

#predictionPage{
display:none;
width:400px;
}

.result{
margin-top:15px;
text-align:center;
font-weight:bold;
color:#333;
}

</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div class="container" id="loginPage">
<h2>Login</h2>

<input type="text" placeholder="Username" id="username">
<input type="password" placeholder="Password" id="password">

<button onclick="login()">Login</button>

<p class="link">Machine Learning Prediction System</p>
</div>


<!-- PREDICTION PAGE -->

<div class="container" id="predictionPage">

<h2>Prediction System</h2>

<input type="number" placeholder="Enter Age">
<input type="number" placeholder="Enter Income">
<input type="number" placeholder="Enter Credit Score">

<button onclick="predict()">Predict</button>

<div class="result" id="result"></div>

</div>


<script>

function login(){

let user=document.getElementById("username").value;
let pass=document.getElementById("password").value;

if(user==="admin" && pass==="1234")
{
document.getElementById("loginPage").style.display="none";
document.getElementById("predictionPage").style.display="block";
}
else
{
alert("Invalid Login");
}

}

function predict(){

let output=Math.random()>0.5 ? "Prediction: Approved" : "Prediction: Rejected";

document.getElementById("result").innerText=output;

}

</script>

</body>
</html>
